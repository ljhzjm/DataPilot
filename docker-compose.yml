name: datapilot

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datapilot}
      POSTGRES_USER: ${POSTGRES_USER:-datapilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datapilot_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-25432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-datapilot} -d ${POSTGRES_DB:-datapilot}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-26379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-datapilot}:${POSTGRES_PASSWORD:-datapilot_dev_password}@postgres:5432/${POSTGRES_DB:-datapilot}"
      REDIS_URL: "redis://redis:6379/0"
      CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-18080}","http://localhost:5173"]'
      AUTH_ENABLED: "${AUTH_ENABLED:-true}"
      AUTH_SESSION_COOKIE_NAME: "${AUTH_SESSION_COOKIE_NAME:-datapilot_session}"
      AUTH_SESSION_TTL_SECONDS: "${AUTH_SESSION_TTL_SECONDS:-604800}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
      AUTH_RATE_LIMIT_REQUESTS: "${AUTH_RATE_LIMIT_REQUESTS:-120}"
      AUTH_RATE_LIMIT_WINDOW_SECONDS: "${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}"
      AUTH_LOGIN_RATE_LIMIT_REQUESTS: "${AUTH_LOGIN_RATE_LIMIT_REQUESTS:-10}"
      SANDBOX_IMAGE: "datapilot/sandbox:dev"
      SANDBOX_TIMEOUT_SECONDS: "10"
      SANDBOX_MEMORY_LIMIT: "512m"
      SANDBOX_PIDS_LIMIT: "64"
      SANDBOX_CPU_LIMIT: "1.0"
      SANDBOX_OUTPUT_LIMIT_BYTES: "8192"
      SANDBOX_MAX_CODE_LINES: "300"
      SANDBOX_MAX_CODE_CHARS: "80000"
      SANDBOX_MAX_INPUT_BYTES: "48000"
      ARTIFACT_STORAGE_DIR: "/app/data/artifacts"
      SANDBOX_ARTIFACT_MAX_FILES: "20"
      SANDBOX_ARTIFACT_MAX_BYTES: "10485760"
      POSTGRES_QUERY_TIMEOUT_SECONDS: "10"
      POSTGRES_MAX_ROWS: "1000"
      DATASET_RESTORE_ON_STARTUP: "true"
      CHAT_RUNTIME_MODE: "${CHAT_RUNTIME_MODE:-agent}"
      CHAT_HISTORY_LIMIT: "20"
      CHAT_HISTORY_CHAR_BUDGET: "12000"
      AGENT_MAX_STEPS: "${AGENT_MAX_STEPS:-10}"
      AGENT_MAX_TOTAL_TOKENS: "${AGENT_MAX_TOTAL_TOKENS:-49152}"
      AGENT_MAX_TOOL_CALLS_PER_STEP: "${AGENT_MAX_TOOL_CALLS_PER_STEP:-3}"
      AGENT_MAX_TOOL_BUDGET_RETRIES: "${AGENT_MAX_TOOL_BUDGET_RETRIES:-1}"
      AGENT_MAX_PARALLEL_TOOLS: "${AGENT_MAX_PARALLEL_TOOLS:-3}"
      AGENT_CONTEXT_CHAR_BUDGET: "${AGENT_CONTEXT_CHAR_BUDGET:-24000}"
      AGENT_KEEP_RECENT_TOOL_RESULTS: "${AGENT_KEEP_RECENT_TOOL_RESULTS:-6}"
      AGENT_PARALLEL_TOOLS: "${AGENT_PARALLEL_TOOLS:-true}"
      MCP_ENABLED: "${MCP_ENABLED:-true}"
      MCP_SERVER_ARGS: '["-m","app.mcp.server"]'
      MCP_STARTUP_TIMEOUT_SECONDS: "10"
      MCP_CONNECT_ATTEMPTS: "${MCP_CONNECT_ATTEMPTS:-3}"
      MCP_RETRY_BASE_DELAY_SECONDS: "${MCP_RETRY_BASE_DELAY_SECONDS:-0.5}"
      MCP_RETRY_MAX_DELAY_SECONDS: "${MCP_RETRY_MAX_DELAY_SECONDS:-5}"
      MCP_HEALTHCHECK_INTERVAL_SECONDS: "${MCP_HEALTHCHECK_INTERVAL_SECONDS:-15}"
      MCP_TOOL_REFRESH_INTERVAL_SECONDS: "${MCP_TOOL_REFRESH_INTERVAL_SECONDS:-300}"
      MCP_CALL_RETRY_ATTEMPTS: "${MCP_CALL_RETRY_ATTEMPTS:-1}"
      LLM_PROVIDER_NAME: "${LLM_PROVIDER_NAME:-openai_compatible}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.openai.com/v1}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_DEFAULT_MODEL: "${LLM_DEFAULT_MODEL:-gpt-4o-mini}"
      LLM_TASK_MODELS: '${LLM_TASK_MODELS:-{"sql":"gpt-4o-mini","intent":"gpt-4o-mini"}}'
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-60}"
      LLM_MAX_RETRIES: "${LLM_MAX_RETRIES:-2}"
      LLM_INCLUDE_USAGE_IN_STREAM: "${LLM_INCLUDE_USAGE_IN_STREAM:-true}"
      LLM_INPUT_PRICE_PER_MILLION: "${LLM_INPUT_PRICE_PER_MILLION:-0}"
      LLM_OUTPUT_PRICE_PER_MILLION: "${LLM_OUTPUT_PRICE_PER_MILLION:-0}"
      DATASET_UPLOAD_DIR: "/app/data/uploads"
      DATASET_MAX_UPLOAD_BYTES: "${DATASET_MAX_UPLOAD_BYTES:-20971520}"
      DATASET_MAX_ROWS: "${DATASET_MAX_ROWS:-500000}"
      DATASET_MAX_COLUMNS: "${DATASET_MAX_COLUMNS:-500}"
      SANDBOX_RUNNER_URL: "http://sandbox-runner:8100"
      SANDBOX_RUNNER_TOKEN: "${SANDBOX_RUNNER_TOKEN:-datapilot-dev-sandbox-token}"
      SANDBOX_RUNNER_TIMEOUT_SECONDS: "12"
      UV_PROJECT_ENVIRONMENT: /opt/venv
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18000}:8000"
    volumes:
      - ./backend:/app
      - dataset_data:/app/data/uploads
      - artifact_data:/app/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      sandbox-runner:
        condition: service_healthy
    networks:
      - default
      - sandbox_control
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    image: datapilot-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-datapilot}:${POSTGRES_PASSWORD:-datapilot_dev_password}@postgres:5432/${POSTGRES_DB:-datapilot}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  sandbox-runner:
    image: datapilot-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      [
        "uvicorn",
        "app.sandbox.runner_service:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8100",
      ]
    environment:
      SANDBOX_IMAGE: "datapilot/sandbox:dev"
      SANDBOX_TIMEOUT_SECONDS: "10"
      SANDBOX_MEMORY_LIMIT: "512m"
      SANDBOX_PIDS_LIMIT: "64"
      SANDBOX_CPU_LIMIT: "1.0"
      SANDBOX_OUTPUT_LIMIT_BYTES: "8192"
      SANDBOX_MAX_CODE_LINES: "300"
      SANDBOX_MAX_CODE_CHARS: "80000"
      SANDBOX_MAX_INPUT_BYTES: "48000"
      SANDBOX_DATASET_VOLUME: "datapilot_dataset_data"
      SANDBOX_ARTIFACT_WORK_VOLUME: "datapilot_artifact_work_data"
      SANDBOX_ARTIFACT_WORK_ROOT: "/artifact-work"
      SANDBOX_ARTIFACT_MAX_FILES: "20"
      SANDBOX_ARTIFACT_MAX_BYTES: "10485760"
      SANDBOX_RUNNER_TOKEN: "${SANDBOX_RUNNER_TOKEN:-datapilot-dev-sandbox-token}"
      PYTHONDONTWRITEBYTECODE: "1"
      HOME: "/tmp"
      UV_PROJECT_ENVIRONMENT: /opt/venv
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - artifact_work_data:/artifact-work
    networks:
      - sandbox_control
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-18080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  sandbox:
    image: datapilot/sandbox:dev
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    profiles: ["sandbox"]
    command: ["sleep", "infinity"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /workspace:size=128m,noexec,nosuid,nodev
    mem_limit: 512m
    pids_limit: 64
    cpus: "1.0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    working_dir: /workspace
    init: true
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  dataset_data:
  artifact_data:
  artifact_work_data:

networks:
  sandbox_control:
    internal: true
