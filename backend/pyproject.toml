[project]
name = "datapilot-backend"
version = "0.1.0"
description = "DataPilot conversational data analysis agent backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "docker>=7.1,<8",
    "duckdb>=1.1,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "redis[hiredis]>=5.2,<6",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "sqlglot>=26,<30",
    "structlog>=24.4,<26",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
    "types-docker>=7.1,<8",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
markers = ["integration: requires a local Docker daemon and sandbox image"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
